name: Release

on:
  release:
    types: [published] # 只在 Release 被发布时触发（不覆盖草稿）

permissions:
  contents: write

jobs:
  # 将 CHANGELOG / BALANCE 的当前版本段落写入 Release 正文之前，
  # 与构建任务并行执行，互不依赖。
  notes:
    name: Update Release notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 读取 CHANGELOG.md / BALANCE.md 当前版本，按
      # CHANGELOG → BALANCE → 默认 Release Notes 的顺序追加。
      - name: Prepend CHANGELOG and BALANCE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python .github/scripts/update_release_notes.py

  build:
    name: Build for Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 缓存 NuGet 全局包目录，键基于 csproj 内容哈希；
      # 依赖未变时直接命中缓存，跳过重复下载。
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      # ---------- 不内置 Runtime（默认名称，体积最小，需预装 .NET 10 桌面运行时）----------
      # 用默认 exe 名的即此产物：托管程序集全部打进 exe，解压后只有一个可执行文件。
      - name: Publish framework-dependent
        run: >
          dotnet publish SearchFightExtract.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -warnaserror
          -o publish/framework-dependent

      # ---------- 内置 Runtime（自包含）----------
      # 自包含发布会产出 200+ 个文件（.NET 运行时原生库等），
      # 因此改用完整目录发布后打包成 zip，用户解压后即可运行，
      # 产物确定性最高，避免把文件散落在当前目录。
      - name: Publish self-contained
        run: >
          dotnet publish SearchFightExtract.csproj
          -c Release
          -r win-x64
          --self-contained true
          -warnaserror
          -o publish/SearchFightExtract-selfcontained

      # 压缩整个目录，使 zip 内以 SearchFightExtract-selfcontained/ 为根，
      # 用户解压后不会把两百余个文件散在当前目录。
      - name: Bundle self-contained into zip
        shell: pwsh
        run: >
          Compress-Archive
          -Path publish/SearchFightExtract-selfcontained
          -DestinationPath publish/SearchFightExtract-selfcontained.zip
          -CompressionLevel Optimal

      # 符号文件（.pdb）在部分发布配置下可能不生成，
      # fail_on_unmatched_files 关闭以免因此中断发布。
      - name: Upload assets to Release
        uses: softprops/action-gh-release@v2
        with:
          upload_url: ${{ github.event.release.upload_url }}
          fail_on_unmatched_files: false
          files: |
            publish/framework-dependent/SearchFightExtract.exe
            publish/framework-dependent/SearchFightExtract.pdb
            publish/SearchFightExtract-selfcontained.zip
